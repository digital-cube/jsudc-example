name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm install` also runs `prepare`, which builds dist. No lockfile yet: @jsudc/core
      # 0.1.0 is not on a registry until the first release; commit one then and use `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The tarball holds dist (JS, .d.ts, styles.css, tokens.css), README and LICENSE only.
      - run: npm pack --dry-run
