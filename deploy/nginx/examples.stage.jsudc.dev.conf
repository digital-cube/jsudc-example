# =====================================================================
# examples.stage.jsudc.dev — jsudc example app (UDC in TypeScript), stage:
# the dev stack with HMR, on purpose.
#
# TLS is terminated UPSTREAM (the edge 65.108.45.136, same as stage.jsudc.dev),
# so this vhost listens on :80 only; the edge forwards the name to this VM.
#
# Everything goes to the Vite dev server (127.0.0.1:5101), which serves the
# React app with HMR and itself proxies POST /udc/* and /healthz to the
# Fastify backend on 127.0.0.1:5100. Vite's host check is satisfied by the
# env var __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=examples.stage.jsudc.dev
# on the dev process.
#
# The dev process is the systemd user unit jsudc-dev, run from the root
# checkout /home/digital/work/jsudc (deploy/systemd/jsudc-dev.service):
#   VITE_PORT=5101 PORT=5100 \
#   __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=examples.stage.jsudc.dev \
#   npm run dev
#
# Install (deploy/install.sh does this, and drops the old link
# /etc/nginx/sites-enabled/jsudc.igor.digitalcube.work):
#   sudo ln -sfn /home/digital/work/jsudc/deploy/nginx/examples.stage.jsudc.dev.conf \
#       /etc/nginx/sites-enabled/examples.stage.jsudc.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/deploy.sh   (from the root checkout, on main)
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name examples.stage.jsudc.dev;

    access_log /var/log/nginx/examples.stage.jsudc.access.log;
    error_log  /var/log/nginx/examples.stage.jsudc.error.log;

    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Vite HMR websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# The old name (until 2026-10-30): a permanent redirect to the new host. The
# target is absolute and https, so it does not matter that this block is :80
# behind the edge. Nothing from this name reaches Vite any more, which is why
# the unit allows only examples.stage.jsudc.dev.
server {
    listen 80;
    listen [::]:80;

    server_name jsudc.igor.digitalcube.work;

    access_log /var/log/nginx/examples.stage.jsudc.access.log;
    error_log  /var/log/nginx/examples.stage.jsudc.error.log;

    return 301 https://examples.stage.jsudc.dev$request_uri;
}
