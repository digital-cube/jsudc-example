# =====================================================================
# jsudc.igor.digitalcube.work — jsudc (UDC in TypeScript), dev stack.
#
# TLS is terminated UPSTREAM (hetzner4 / edge), so this vhost listens on
# :80 only — same shape as every other *.igor.digitalcube.work site here.
#
# Everything goes to the Vite dev server (127.0.0.1:5101), which serves the
# React app with HMR and itself proxies POST /udc/* and /healthz to the
# Fastify backend on 127.0.0.1:5100. Vite's host check is satisfied by the
# env var __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=jsudc.igor.digitalcube.work
# on the dev process.
#
# The dev process is the systemd user unit jsudc-dev, run from the root
# checkout /home/digital/work/jsudc (deploy/systemd/jsudc-dev.service):
#   VITE_PORT=5101 PORT=5100 \
#   __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=jsudc.igor.digitalcube.work \
#   npm run dev
#
# Install (deploy/install.sh does this):
#   sudo ln -sfn /home/digital/work/jsudc/deploy/nginx/jsudc.igor.digitalcube.work.conf \
#       /etc/nginx/sites-enabled/jsudc.igor.digitalcube.work
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/deploy.sh   (from the root checkout, on main)
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name jsudc.igor.digitalcube.work;

    access_log /var/log/nginx/jsudc.igor.access.log;
    error_log  /var/log/nginx/jsudc.igor.error.log;

    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Vite HMR websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
