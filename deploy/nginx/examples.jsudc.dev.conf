# =====================================================================
# examples.jsudc.dev — jsudc example app (UDC in TypeScript), PRODUCTION:
# a real build, not the dev stack.
#
# TLS is terminated UPSTREAM (the edge h2 holds the Let's Encrypt lineage),
# so this vhost listens on :80 only; the edge forwards the name to this VM.
#
#   /                 static files of the Vite build: /home/digital/sites/examples.jsudc.dev/current
#                     (-> releases/<short sha>/, swapped by deploy/prod.sh), SPA fallback to /index.html
#   /assets/          the hashed bundles: cached for a year, immutable
#   POST /udc/*       the UDC protocol -> Fastify 127.0.0.1:5100
#   GET  /udc/*       an app route (/udc/<collection> is a page) -> /index.html,
#                     the same rule as the Vite proxy's `bypass` in frontend/vite.config.ts
#   /udc/files/blob   the file preview, a GET that must reach the backend
#   /healthz          -> Fastify
#
# The backend is the systemd user unit jsudc-prod (deploy/systemd/jsudc-prod.service),
# `npm start -w @jsudc/backend` from /home/digital/sites/examples.jsudc.dev/src.
#
# Install (deploy/prod.sh --install does this):
#   sudo ln -sfn /home/digital/sites/examples.jsudc.dev/src/deploy/nginx/examples.jsudc.dev.conf \
#       /etc/nginx/sites-available/examples.jsudc.dev
#   sudo ln -sfn /etc/nginx/sites-available/examples.jsudc.dev /etc/nginx/sites-enabled/examples.jsudc.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/prod.sh   (on the VM, as digital)
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name examples.jsudc.dev;

    access_log /var/log/nginx/examples.jsudc.dev.access.log;
    error_log  /var/log/nginx/examples.jsudc.dev.error.log;

    root  /home/digital/sites/examples.jsudc.dev/current;
    index index.html;

    # The hashed bundles of the Vite build: a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The file preview is a GET; it must reach the backend before the rule below sends GETs to the app.
    location /udc/files/blob {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # `/udc/<collection>` is also an app route: only the RPC (always a POST)
    # goes to the backend, a page load gets the app.
    location /udc/ {
        if ($request_method != POST) {
            rewrite ^ /index.html last;
        }
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The HTML is never cached: it names the current bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
