# The application menu — this file IS the sidebar.
#
# Every node is one row of the `menu` collection (source: yaml_menu). The
# backend flattens this tree on every read whose mtime changed: a node's id
# is the sha1 of its path of codes from the root ("COLLECTIONS/DATABASE"),
# so moving a node among its siblings keeps its id, renaming its code (or
# an ancestor's) gives it a new one. `order` is the position among the
# siblings, `depth` counts from 0, `children_count` is what the node has
# after its reference (below) is resolved.
#
# Keys of a node:
#   code             unique among its siblings; letters, digits, _ . -
#   translation_key  <SECTION>_<TERM>, shown through t(section, term):
#                    MENU_HOME → t("MENU", "HOME"); the raw key when untranslated
#   icon             lucide:<kebab-name>, e.g. lucide:calendar-days
#   url              a route of this app; a node with a url is a link
#   children         a list of nodes, or a reference string:
#                    "udc:collections"                 every collection served
#                    "udc:collections?group=database"  …of one sidebar group
#                    (database | files | internet). Resolved inside the
#                    server against the live registry on every read: the
#                    nodes it adds are `is_dynamic: true`.
#
# Edit this file, reload the page: the sidebar has changed.

- code: HOME
  translation_key: MENU_HOME
  icon: lucide:house
  url: /

- code: COLLECTIONS
  translation_key: MENU_COLLECTIONS
  icon: lucide:layers
  children:
    - code: DATABASE
      translation_key: MENU_DATABASE
      icon: lucide:database
      children: "udc:collections?group=database"
    - code: FILES
      translation_key: MENU_FILES
      icon: lucide:folder-open
      children: "udc:collections?group=files"
    - code: INTERNET
      translation_key: MENU_INTERNET
      icon: lucide:globe
      children: "udc:collections?group=internet"

# One entry per renderer the demo shows off, each opening the tab it is about.
- code: VIEWS
  translation_key: MENU_VIEWS
  icon: lucide:layout-grid
