    - code: APPOINTMENTS_CALENDAR
      translation_key: MENU_VIEW_APPOINTMENTS
      icon: lucide:calendar-days
      url: /udc/appointments?tab=calendar
    - code: COMPANIES_MAP
      translation_key: MENU_VIEW_COMPANIES
      icon: lucide:map
      url: /udc/companies?tab=map
    - code: ORG_TREE
      translation_key: MENU_VIEW_ORG
