# The messages of the demo user asking (x-demo-user), owner as the row scope.
# /mail embeds this view between its folder list and its reading pane: the
# open folder as the host's filter, no chrome, the keys and row activation.
# `seen` is drawn by the example's own cell (render: unread_dot, registered
# in frontend/src/mail/cells.tsx): a dot for an unread message.
# 0.5.0 adds selection with a bulk bar, a menu of actions on each row, and the
# search box answered by the table's full-text index (the source reports
# `capabilities.search: "source"`, so the box's text goes to the server as
# `search` instead of the `contains` filters over `search.fields`).
default_renderer: table
available_renderers: [table, cards]
pagination: infinite
page_size_default: 50
row_height: 40

# Newest first (0.6.0): the first `list` already carries this sort, the header
# shows it, and it is not written into the URL. A typed search drops it (the
# source answers by rank); clearing the search brings it back. A sort the user
# clicks replaces it. The source has the same `defaultSort` for a client
# without this view.
default_sort: [{field: received_at, dir: desc}]

# Every schema field is a column (describe adds the ones a view leaves out),
# so the ones the reading pane shows instead come last.
columns:
  - {field: seen, render: unread_dot, pin: left, width: 78, align: center}
  - {field: sender_name, pin: left, width: 190}
  - {field: subject, width: 340}
  - {field: received_at, width: 130, transform: "date_format:DD.MM. HH:mm"}
  - {field: folder_name, width: 110, color: muted}
  - {field: size_bytes, render: bytes, align: right, width: 90, color: muted}
  - {field: sender_email, width: 200, color: muted}
  - {field: preview, width: 320, color: muted}
  - {field: folder_id, width: 120, color: muted}
  - {field: body, width: 200, color: muted}

card_options:
  title_field: subject
  subtitle_field: sender_name
  meta_fields: [seen, received_at]

search:
  fields: [subject, sender_name, sender_email, preview]
  placeholder: 'Search: words, "a phrase", -exclude'
  case_insensitive: true

filters:
  - field: seen
    kind: bool
    label: Seen

# Selection: a checkbox column, Space on the active row, shift-click for a range.
# The source has no total (total_count: false), so "select all that match"
# offers no number; an action then goes to the server by the filter (the open
# folder, the chips) minus the rows unticked, not by ids.
multiselect: true

# The bulk bar. mark_read / mark_unread carry `set`: a mutate_many update, no
# handler. archive has no `set`: the example's handler moves the selection to
# the Archive folder through its own host action (mail.move_to_folder).
# delete is built in: a confirmation, then a mutate_many delete. With the
# messages' onMutate each row is audited, and a failing hook rolls the whole
# request back.
bulk_actions:
  - {kind: mark_read, label: Mark read, icon: "lucide:mail-open", set: {seen: true}}
  - {kind: mark_unread, label: Mark unread, icon: "lucide:mail", set: {seen: false}}
  - {kind: archive, label: Archive, icon: "lucide:archive"}
  - {kind: delete, label: Delete, icon: "lucide:trash-2", variant: destructive}

# The same kinds for one row, in a "more" menu (also right-click, Shift+F10 or
# "." on the active row), each only where its `when` holds for that row: no
# "Mark read" on a read message, no "Archive" in the Archive.
row_actions_display: menu
row_action_defs:
  - kind: mark_read
    label: Mark read
    icon: "lucide:mail-open"
    set: {seen: true}
    when: {field: seen, op: eq, value: false}
  - kind: mark_unread
    label: Mark unread
    icon: "lucide:mail"
    set: {seen: false}
    when: {field: seen, op: eq, value: true}
  - kind: archive
    label: Archive
    icon: "lucide:archive"
    when: {field: folder_name, op: neq, value: Archive}
  - {kind: delete, label: Delete, icon: "lucide:trash-2", variant: destructive}
