# The columns of the kanban example, one row per column per board. A plain
# table: the board renders them through `tickets`' kanban_options.
default_renderer: table
available_renderers: [table]
pagination: infinite
page_size_default: 50

columns:
  - {field: name, pin: left, editable: true, width: 200}
  - {field: board_id, width: 300}
  - {field: color, width: 110}
  - {field: order, render: number_format, align: right, width: 90}
  - {field: is_done, render: bool, render_options: {style: check_x}, align: center, width: 90}

search:
  fields: [name]
  placeholder: Search buckets

filterable:
  fields: [name, board_id, is_done, order]
